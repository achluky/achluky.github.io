name: Update Publications from Google Scholar

# Workflow ini akan auto-update publikasi dari Google Scholar
# Berjalan setiap minggu atau bisa di-trigger manual

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-publications:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install scholarly
    
    - name: Update publications data
      run: |
        python update_publications.py
    
    - name: Check if there are changes
      id: verify_diff
      run: |
        git diff --quiet data/publications.json || echo "changed=true" >> $GITHUB_OUTPUT
    
    - name: Commit and push if changed
      if: steps.verify_diff.outputs.changed == 'true'
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add data/publications.json
        git commit -m "Auto-update publications from Google Scholar [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
